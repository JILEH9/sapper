services:
  bot:
    build: .
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["sh", "-c", "node src/index.js >> /app/logs/bot.log 2>&1"]
